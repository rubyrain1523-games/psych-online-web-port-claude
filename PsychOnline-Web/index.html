// Fetches zipped mods from the repo's top-level "mods" folder (../mods relative to this page) and queues them for install.
function __psychLoadZips(done) {
  var msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:10;color:#ccc;font:13px monospace;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px';
  var finished = false;
  function fin() { if (finished) return; finished = true; if (msg.parentNode) msg.parentNode.removeChild(msg); done(); }
  setTimeout(fin, 120000);
  var seen = {};
  try { seen = JSON.parse(localStorage.getItem('psychAutoMods') || '{}'); } catch (e) {}
  function save() { try { localStorage.setItem('psychAutoMods', JSON.stringify(seen)); } catch (e) {} }
  function list() {
    return fetch('../mods/index.json', { cache: 'no-cache' }).then(function(r) {
      if (!r.ok) throw 0; return r.json();
    }).then(function(j) {
      return j.map(function(x) { return typeof x === 'string' ? { name: x } : x; });
    }).catch(function() {
      var m = location.hostname.match(/^(.+)\.github\.io$/);
      if (!m) return [];
      var repo = location.pathname.split('/')[1];
      return fetch('https://api.github.com/repos/' + m[1] + '/' + repo + '/contents/mods').then(function(r) {
        if (!r.ok) throw 0; return r.json();
      }).then(function(j) {
        return j.filter(function(x) { return x.type === 'file'; }).map(function(x) { return { name: x.name, size: x.size }; });
      }).catch(function() { return []; });
    });
  }
  list().then(function(files) {
    files = files.filter(function(f) { return /\.zip$/i.test(f.name); });
    var chain = Promise.resolve();
    files.forEach(function(f, i) {
      chain = chain.then(function() {
        if (f.size != null && seen[f.name] === f.size) return;
        msg.textContent = 'Loading mod ' + (i + 1) + '/' + files.length + ': ' + f.name;
        document.body.appendChild(msg);
        return fetch('../mods/' + encodeURIComponent(f.name), { cache: 'no-cache' }).then(function(r) {
          if (!r.ok) throw 0; return r.arrayBuffer();
        }).then(function(buf) {
          if (seen[f.name] === buf.byteLength) return;
          window.__psychZips.push({ name: f.name, data: new Uint8Array(buf) });
          seen[f.name] = buf.byteLength; save();
        }).catch(function() {});
      });
    });
    return chain;
  }).then(fin, fin);
}
function __psychBoot(go0) {
  var go = function() {
    var done = false; var fin = function() { if (!done) { done = true; if (window.__psychModsEnabled) __psychLoadZips(go0); else go0(); } };
    try { Promise.all(Array.from(document.fonts).map(function(f) { return f.load().catch(function() {}); })).then(fin); setTimeout(fin, 8000); } catch (e) { fin(); }
  };

    req.onupgradeneeded = function(e) { e.target.result.createObjectStore('files'); };
    req.onerror = function() { go(); };

      var db = e.target.result; window.__vfsDb = db;

      c.onerror = function() { go(); };
    };
  } catch (e) { go(); }
}

            c.n.forEach(function(nn) {
              var s = Math.round(nn[0] / (ppq / 4)), len = Math.max(1, Math.round(nn[2] / (ppq / 4))); if (s >= 512) return; maxStep = Math.max(maxStep, s + len);
              var pi; if (tr === 'drums') pi = nn[1] === 36 || nn[1] === 35 ? 2 : (nn[1] === 38 || nn[1] === 40) ? 1 : 0; else pi = 48 + (((nn[1] % 24) + 24) % 24);
              st.mus[tr][s + '_' + pi] = tr === 'drums' ? 1 : len;
            });
          });
          var nb = Math.min(32, Math.max(4, Math.ceil(maxStep / 16))); $('mm-bars').value = [4, 8, 12, 16, 24, 32].filter(function(x) { return x >= nb; })[0] || 32;
          map.innerHTML = ''; self.value = ''; $('mm-minfo').textContent = 'MIDI imported (' + $('mm-bpm').value + ' BPM). Edit it here, then press "Use in song".'; pdraw();
        };
        map.appendChild(ap);
      }).catch(function(e) { $('mm-minfo').textContent = 'MIDI import failed: ' + e; });
    };

    // ---------- assets rows ----------
    var arows = [];
    function addRow() {
      var tr = document.createElement('tr'), obj = { file: null };
      tr.innerHTML = '<td><input type="file"></td><td><input list="mm-targets" placeholder="images/menuBG.png"></td><td style="width:40px"><button class="b">x</button></td>';
      var ins = tr.querySelectorAll('input');
      ins[0].onchange = function() { obj.file = this.files[0] || null; if (obj.file && !ins[1].value) ins[1].value = (/\.(png|xml)$/i.test(obj.file.name) ? 'images/' : /\.(ogg|mp3|wav)$/i.test(obj.file.name) ? 'sounds/' : '') + obj.file.name; };
      obj.target = ins[1]; tr.querySelector('button').onclick = function() { tr.remove(); arows.splice(arows.indexOf(obj), 1); };
      arows.push(obj); $('mm-rows').appendChild(tr);
    }
    $('mm-addrow').onclick = addRow; addRow();

    // ---------- build ----------
    function build() {
      var name = $('mm-name').value.trim() || 'My Song', id = slug(name) || 'my-song', files = [], enc = new TextEncoder(), top = id + '/', jobs = [];
      function add(p, d) { files.push({ name: top + p, data: d }); }
      var b = bpm(), sm = stepMs(), n = Object.keys(st.notes).length, instF = st.instFile, vocF = st.vocFile;
      if (n > 0 && !instF) return Promise.reject('Add an instrumental (Song tab) or render music (Music tab) first, or clear the chart notes.');
      if (instF) {
        var secs = Math.ceil(totalSteps() / 16), sections = [], sw = $('mm-side').value === '1';
        for (var i = 0; i < secs; i++) sections.push({ sectionNotes: [], sectionBeats: 4, lengthInSteps: 16, mustHitSection: true, gfSection: false, bpm: b, changeBPM: false, altAnim: false });
        Object.keys(st.notes).forEach(function(k) { var p = k.split('_'), s = +p[0], l = (+p[1] + 4) % 8; if (sw) l = (l + 4) % 8; if (sections[Math.floor(s / 16)]) sections[Math.floor(s / 16)].sectionNotes.push([Math.round(s * sm), l, Math.round(st.notes[k] * sm)]); });
        sections.forEach(function(x) { x.sectionNotes.sort(function(a, c) { return a[0] - c[0]; }); });
        var opp = val('mm-opp'), pl = val('mm-pl'), swap = $('mm-side').value === '1', gf = val('mm-gf'), stg = val('mm-stage'), df = DIFFS[+$('mm-diff').value][1];
        var chart = { song: { song: name, notes: sections, events: [], bpm: b, needsVoices: !!vocF, speed: parseFloat($('mm-speed').value) || 2, player1: swap ? opp : pl, player2: swap ? pl : opp, gfVersion: gf, stage: stg, validScore: true } };
        add('data/' + id + '/' + id + df + '.json', enc.encode(JSON.stringify(chart)));
        add('weeks/' + id + '.json', enc.encode(JSON.stringify({ songs: [[name, opp, hex2rgb($('mm-color').value)]], weekCharacters: swap ? [pl, opp, gf] : [opp, pl, gf], weekBackground: stg, storyName: name, weekBefore: 'tutorial', weekName: name, startUnlocked: true, hideStoryMode: true, hideFreeplay: false, difficulties: DIFFS[+$('mm-diff').value][0] })));
        jobs.push(bytes(instF).then(function(d) { add('songs/' + id + '/Inst.' + ext(instF), d); }));
        if (vocF) jobs.push(bytes(vocF).then(function(d) { add('songs/' + id + '/Voices.' + ext(vocF), d); }));
      }
      arows.forEach(function(r) { if (!r.file) return; var t = r.target.value.trim().replace(/^\/+/, '').replace(/\.\./g, ''); if (t) jobs.push(bytes(r.file).then(function(d) { add(t, d); })); });
      return Promise.all(jobs).then(function() {
        if (!files.length) throw 'Nothing to save yet. Add a song or at least one file.';
        add('pack.json', enc.encode(JSON.stringify({ name: name, description: $('mm-desc').value, restart: false, runsGlobally: false, color: hex2rgb($('mm-color').value) })));
        return { id: id, blob: makeZip(files) };
      });
    }
    $('mm-dl').onclick = function() {
      build().then(function(r) { var a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = r.id + '.zip'; document.body.appendChild(a); a.click(); a.remove(); $('mm-msg').textContent = 'Saved ' + r.id + '.zip. Share it or load it with the Import mod button.'; }, function(e) { $('mm-msg').textContent = String(e); });
    };
    $('mm-inst-btn').onclick = function() {
      if (!window.psychImportZip) { $('mm-msg').textContent = 'Installing works once the game has loaded in a Modded mode. Use Download instead.'; return; }
      build().then(function(r) { return bytes(r.blob).then(function(d) { window.psychImportZip(r.id + '.zip', d); $('mm-msg').textContent = 'Installed. Go to the main menu and open Freeplay to find your song.'; }); }, function(e) { $('mm-msg').textContent = String(e); });
    };
  }
  window.psychOpenMaker = open;
})();
</script>

<script>
(function() {
  var q = new URLSearchParams(location.search);
  var launch = q.get('launch');
  var panel = document.getElementById('psych-launch');
  var note = document.getElementById('psych-launch-note');

  // ---- offline from a local .html (file://): redirect asset requests to a picked folder ----
  var fileMode = location.protocol === 'file:';
  var fileMap = null;
  var baseDir = location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '');
  function relOf(u) {
    try {
      var a = new URL(u, location.href).href.split('#')[0].split('?')[0];
      if (a.indexOf(baseDir) !== 0) return null;
      return decodeURIComponent(a.slice(baseDir.length));
    } catch (e) { return null; }
  }
  function mapUrl(u) {
    if (!fileMap || typeof u !== 'string' || u.indexOf('blob:') === 0 || u.indexOf('data:') === 0) return u;
    var r = relOf(u);
    return (r !== null && fileMap[r]) ? fileMap[r] : u;
  }
  function installFileShim(files) {
    fileMap = {};
    Array.prototype.forEach.call(files, function(f) {
      var rp = (f.webkitRelativePath || f.name).split('/').slice(1).join('/');
      if (rp) fileMap[rp] = URL.createObjectURL(f);
    });
    var xo = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(m, u) { arguments[1] = mapUrl(String(u)); return xo.apply(this, arguments); };
    var fe = window.fetch;
    window.fetch = function(u, o) { return fe.call(this, (typeof u === 'string') ? mapUrl(u) : u, o); };
    var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (d && d.set) Object.defineProperty(HTMLImageElement.prototype, 'src', { get: d.get, set: function(v) { d.set.call(this, mapUrl(String(v))); } });
    return Object.keys(fileMap).length;
  }
  function pickFolder(then) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.webkitdirectory = true; inp.style.display = 'none';
    inp.onchange = function() {
      var n = installFileShim(inp.files);
      if (!fileMap['vfs_manifest.json']) { note.textContent = 'That folder does not look right. Pick the PsychOnline-Web folder (the one containing index.html and assets).'; fileMap = null; return; }
      note.textContent = ''; then();
    };
    document.body.appendChild(inp); inp.click();
  }
  function needFolder(then) {
    if (!fileMode || fileMap) { then(); return; }
    note.textContent = 'Offline mode: choose the PsychOnline-Web folder so the game can read its files (nothing is uploaded).';
    pickFolder(then);
  }
  if (fileMode) {
    Array.prototype.forEach.call(panel.querySelectorAll('button[data-hidden="1"]'), function(b) { b.style.display = 'none'; });
    var fm = document.createElement('p'); fm.style.color = '#ffb86b';
    fm.textContent = 'Running from a local file: you will be asked to pick this folder once per launch. Hidden mode needs the hosted link.';
    panel.querySelector('h1').after(fm);
  }
  function startGame(mods) {
    window.__psychModsEnabled = !!mods;
    panel.style.display = 'none';
    var sc = document.createElement('script');
    sc.src = './PsychOnline.js?v=1792963672';
    sc.onload = function() { __psychBoot(function() { lime.embed("PsychOnline", "openfl-content", 1280, 720, { parameters: {} }); }); };
    document.head.appendChild(sc);
    if (mods) addImportButton();
  }
  function addImportButton() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.zip'; inp.multiple = true; inp.style.display = 'none';
    var btn = document.createElement('button');
    btn.textContent = 'Import mod (.zip)';
    btn.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;padding:6px 10px;border-radius:8px;border:1px solid #555;background:rgba(20,20,30,.8);color:#fff;font:13px system-ui,sans-serif;cursor:pointer;opacity:.75';
    btn.onmouseenter = function() { btn.style.opacity = 1; };
    btn.onmouseleave = function() { btn.style.opacity = .75; };
    btn.onclick = function() { inp.click(); };
    inp.onchange = function() {
      Array.prototype.forEach.call(inp.files, function(f) {
        f.arrayBuffer().then(function(buf) {
          if (window.psychImportZip) window.psychImportZip(f.name, new Uint8Array(buf));
          else alert('The game is still loading. Try again in a moment.');
        });
      });
      inp.value = '';
    };
    var mb = btn.cloneNode(true); mb.textContent = 'Mod Maker'; mb.style.left = '150px'; mb.onmouseenter = btn.onmouseenter; mb.onmouseleave = function() { mb.style.opacity = .75; }; mb.onmouseenter = function() { mb.style.opacity = 1; }; mb.onclick = function() { window.psychOpenMaker(); };
    document.body.appendChild(inp); document.body.appendChild(btn); document.body.appendChild(mb);
  }
  function openHidden(mods) {
    var base = location.href.split('#')[0].split('?')[0];
    var url = base + '?launch=' + (mods ? 'modded' : 'vanilla');
    var w = window.open('about:blank', '_blank');
    if (!w) { note.textContent = 'Your browser blocked the pop-up. Allow pop-ups for this site and try again.'; return; }
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title></title></head><body style="margin:0;background:#000"><iframe src="' + url + '" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe></body></html>');
    w.document.close();
    note.textContent = 'Opened in a new about:blank tab. You can close this one.';
  }
  if (!fileMode && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('./sw.js'); } catch (e) {} }
  document.getElementById('psych-mm').onclick = function() { window.psychOpenMaker(); };
  if (launch === 'vanilla' || launch === 'modded') { startGame(launch === 'modded'); return; }
  Array.prototype.forEach.call(panel.querySelectorAll('button'), function(b) {
    b.addEventListener('click', function() {
      var mods = b.getAttribute('data-mods') === '1';
      if (b.getAttribute('data-hidden') === '1') openHidden(mods); else needFolder(function() { startGame(mods); });
    });
  });
})();
</script>
