name: Build Psych Online Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psych-online-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile HTML5 build
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out this port's patches
        uses: actions/checkout@v4
        with:
          path: port

      - name: Check out upstream Psych Online
        uses: actions/checkout@v4
        with:
          repository: Snirozu/Funkin-Psych-Online
          ref: main
          path: psych-work
          fetch-depth: 1

      - name: Overlay browser-port patches
        shell: bash
        run: |
          set -euo pipefail
          cp -a port/src-patch/. psych-work/
          test -f psych-work/Project.xml
          test -d psych-work/source

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential zip libgl1-mesa-dev libx11-dev libxext-dev libxrender-dev libxinerama-dev libxcursor-dev libxi-dev libasound2-dev

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.6"

      - name: Set up Haxelib
        working-directory: psych-work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 8.1.3
          haxelib run lime setup
          haxelib install hxcpp

      - name: Build HTML5 release
        working-directory: psych-work
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build html5 -Dweb -nolaunch

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          OUT="psych-work/export/release/html5/bin"
          if [ ! -d "$OUT" ]; then
            echo "Expected build folder not found: $OUT"
            find psych-work/export -maxdepth 5 -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          if ! find "$OUT" -maxdepth 2 -type f -name '*.html' | grep -q .; then
            echo "No HTML entry page found in $OUT"
            find "$OUT" -maxdepth 2 -type f | head -100
            exit 1
          fi
          test -n "$(find "$OUT" -maxdepth 2 -type f -name '*.js' -print -quit)"

      - name: Package ready-to-run web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd psych-work/export/release/html5/bin
          zip -qr "$GITHUB_WORKSPACE/dist/Psych-Online-Web-HTML5.zip" .
          cd "$GITHUB_WORKSPACE"
          cp -a psych-work/export/release/html5/bin/. dist/
          cat > dist/README-DOWNLOAD.txt <<'TXT'
          Psych Online HTML5 Web Build

          Extract Psych-Online-Web-HTML5.zip and serve the extracted folder
          using a local web server or upload the folder to a static web host.
          Opening index.html directly may not work because browsers restrict
          some game assets loaded from local files.

          This is a browser build, not a desktop installer.
          TXT

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Psych-Online-Web-HTML5
          path: dist/
          if-no-files-found: error
          retention-days: 30
